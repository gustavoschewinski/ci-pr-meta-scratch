name: PR meta

# pull_request_target so the token can write on fork PRs. Nothing here checks out
# or runs PR code: the labeler reads .github/labeler.yml and the file list through
# the API, so keep it that way.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-meta:
    runs-on: ubuntu-slim
    steps:
      - name: Label PR
        if: github.event.action != 'edited'
        uses: actions/labeler@v5

      # GitHub Apps/bots cannot be assigned via installation tokens
      # ("Assigning agents is not supported with GitHub App installation
      # tokens"), so skip auto-assignment when the PR author is a bot.
      - name: Assign PR author
        if: github.event.action == 'opened' && github.event.pull_request.user.type != 'Bot'
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              assignees: [author],
            });

      # Default every new PR to draft so test CI (ci.yml / ci-front.yml) stays
      # idle until the author explicitly clicks "Ready for review". Saves CI
      # minutes on work-in-progress branches.
      #
      # NOTE: convertPullRequestToDraft is NOT accessible by the default
      # GITHUB_TOKEN — it always returns "Resource not accessible by
      # integration" (FORBIDDEN), regardless of the `permissions:` block. The
      # mutation requires a user/PAT token, so this step runs through the
      # AUTO_DRAFT_TOKEN secret (a fine-grained PAT with pull-requests:write on
      # this repo). If the secret is absent the step is skipped so the workflow
      # stays green; create the secret to enable auto-drafting.
      - name: Convert to draft by default
        if: github.event.action == 'opened' && github.event.pull_request.draft == false && env.AUTO_DRAFT_TOKEN != ''
        continue-on-error: true
        env:
          AUTO_DRAFT_TOKEN: ${{ secrets.AUTO_DRAFT_TOKEN }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_DRAFT_TOKEN }}
          script: |
            await github.graphql(
              `mutation($id: ID!) {
                convertPullRequestToDraft(input: { pullRequestId: $id }) {
                  pullRequest { isDraft }
                }
              }`,
              { id: context.payload.pull_request.node_id }
            );

      - name: Validate PR title (Conventional Commits)
        if: "!cancelled() && github.event.action != 'synchronize'"
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
